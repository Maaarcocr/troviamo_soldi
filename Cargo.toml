[package]
name = "funding-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Small Rust/SQLite funding notice ingestion and municipality screening service"

[dependencies]
anyhow = "1"
rayon = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls-native-roots"] }
rig = { version = "=0.44.0", default-features = false, features = ["agent", "reqwest", "rustls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt", "net", "time"] }
url = "2"
zip = "9"

[dev-dependencies]
tempfile = "3"
